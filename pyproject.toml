[tool.poetry]
name = "codoc-in-vecdraw"
version = "0.1.0"
description = "Reflex vector drawing app"
authors = ["Milo Chen <milochen0418@gmail.com>"]
readme = "README.md"
packages = [{include = "codoc_in_vecdraw"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.16"
reflex = {version = "0.10.0", extras = ["db"]}
reflex-mouse-track = "^0.0.1"
mcp = "^1.25.0"
fastapi = "^0.143.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
